[project]
name = "edisk-backend"
version = "0.1.0"
description = "API local do Messaging Lab para Windows."
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Proprietary"
dependencies = [
    "alembic>=1.20.1,<1.21",
    "argon2-cffi>=25.1.0,<26",
    "defusedxml>=0.7.1,<0.8",
    "fastapi>=0.162.0,<0.163",
    "openpyxl>=3.1.5,<3.2",
    "phonenumbers>=9,<10",
    "sqlalchemy>=2.0.55,<2.1",
    "uvicorn>=0.53.0,<0.54",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "httpx2>=2.16.0,<3",
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<0.18",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
